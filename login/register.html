<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke Ruang Tenang</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Register</h2>
                <p>Lanjutkan langkahmu dalam tenang</p>
            </div>
            
            <form class="register-form" id="registerForm" novalidate>
                <div class="form-group">
                    <div class="input-wrapper">
                    <label for="username">Nama Pengguna</label>
                        <input type="text" id="username" name="username" required autocomplete="Username">
                    <div class="input-wrapper">    
                    <label for="email">Email</label>
                        <input type="email" id="email" name="email" required autocomplete="Email">
                        <span class="focus-border"></span>
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <div class="input-wrapper password-wrapper">
                     <label for="password">Kata Sandi</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                            <span class="eye-icon"></span>
                        </button>
                        <span class="focus-border"></span>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-options">
                    <label class="remember-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkbox-label">
                            <span class="checkmark"></span>
                            Ingat Saya
                        </span>
                    </label>
                    <a href="#" class="forgot-password">Lupa Kata Sandi?</a>
                </div>
                
                <div id="alertBox"style="display:none;color:red;"></div>
                <button type="submit" class="login-btn btn">
                    <span class="btn-text">Masuk Kembali</span>
                    <span class="btn-loader"></span>
                </button>
            </form>

            <div class="divider">
                <span>atau lanjutkan dengan</span>
            </div>

            <div class="social-login">
                <button type="button" class="social-btn google-btn">
                    <span class="social-icon google-icon"></span>
                    Google
                </button>
                <button type="button" class="social-btn github-btn">
                    <span class="social-icon github-icon"></span>
                    GitHub
                </button>
            </div>

            <div class="signup-link">
                <p>Belum punya ruangmu?<a href="#">Buat di sini</a></p>
            </div>

            <div class="success-message" id="successMessage">
                <div class="success-icon">✓</div>
                <h3>Berhasil Masuk!</h3>
                <p>Redirecting to your dashboard...</p>
            </div>
        </div>
    </div>
   <p id="message"></p>
</form>

<script src="js/register.js" defer></script>
</body>
</html>
